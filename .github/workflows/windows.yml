name: Windows CI/CD
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    uses: pgextwin/build/.github/workflows/build-extension.yml@79ce986347ce88c8d4bd1021b32d42250d118876
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
