name: Windows CI/CD
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    uses: pgextwin/build/.github/workflows/build-extension.yml@2f4c6c458a16927497a7d549ce72b2e8d13c5b7d
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
